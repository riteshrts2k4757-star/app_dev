name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'mobile/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'mobile/**'
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Node.js ──────────────────────────────────────────────
      # package.json requires node >= 22.11.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/mobile/package-lock.json

      - name: Install Node Dependencies
        working-directory: mobile/mobile
        run: npm ci

      # ── Java / Android SDK ───────────────────────────────────
      # Gradle 9.x + compileSdkVersion 37 requires JDK 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Accept Android SDK licenses so the build can download missing SDK components
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ── Gradle Build ─────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/mobile/android/**/*.gradle*', 'mobile/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        working-directory: mobile/mobile/android
        run: chmod +x ./gradlew

      - name: Build Release APK
        working-directory: mobile/mobile/android
        env:
          CI: 'true'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── Upload ───────────────────────────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: farmtrace-release-apk
          path: mobile/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
